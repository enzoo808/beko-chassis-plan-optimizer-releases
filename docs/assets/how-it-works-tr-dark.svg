<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="t d">
<title id="t">Nasıl çalışır?</title>
<desc id="d">Veri → İki aşamalı optimizasyon → Plan → Öneri ve Asistan</desc>
<style>text{font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif}.b{font-weight:700}.sm{font-size:14px}.mu{fill:#A3B5D0}.tx{fill:#E8EEF8}.flow{stroke-dasharray:6 9;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-30}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(var(--sw,380px))}}.sweep{animation:sweep 7s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes drag{0%,12%{transform:translate(0,0)}45%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}.drag{animation:drag 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.flow,.sweep,.pulse,.drag{animation:none}}</style>
<rect width="1100" height="440" rx="16" fill="#0B1220"/><rect x=".5" y=".5" width="1099" height="439" rx="15.5" fill="none" stroke="#2A3B5C"/><text x="40" y="52" font-size="22" class="b tx">Nasıl çalışır?</text><rect x="40" y="90" width="190" height="170" rx="14" fill="#121C30" stroke="#2A3B5C" stroke-width="1"/><circle cx="66" cy="120" r="13" fill="#2DD4BF"/><text x="66" y="125" text-anchor="middle" font-size="14" class="b" fill="#04201C">1</text><text x="90" y="126" font-size="17" class="b tx">Veri</text><text x="60" y="166" font-size="15" class="mu">Excel dosyaları</text><text x="60" y="192" font-size="15" class="mu">ve elle giriş</text><path class="flow" d="M236 175 H280" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M273 168 L282 175 L273 182" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="90" width="270" height="170" rx="14" fill="#121C30" stroke="#2DD4BF" stroke-width="2"/><circle cx="316" cy="120" r="13" fill="#2DD4BF"/><text x="316" y="125" text-anchor="middle" font-size="14" class="b" fill="#04201C">2</text><text x="340" y="126" font-size="17" class="b tx">İki aşamalı optimizasyon</text><text x="310" y="166" font-size="15" class="mu">1 · Atama: hangi kart,</text><text x="310" y="192" font-size="15" class="mu">hangi hatta, hangi gün</text><text x="310" y="218" font-size="15" class="mu">2 · Denge: stok ve tampon</text><path class="flow" d="M566 175 H600" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M593 168 L602 175 L593 182" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="610" y="90" width="210" height="170" rx="14" fill="#121C30" stroke="#2A3B5C" stroke-width="1"/><circle cx="636" cy="120" r="13" fill="#2DD4BF"/><text x="636" y="125" text-anchor="middle" font-size="14" class="b" fill="#04201C">3</text><text x="660" y="126" font-size="17" class="b tx">Plan</text><text x="630" y="166" font-size="15" class="mu">Sürükle-bırak düzenleme</text><text x="630" y="192" font-size="15" class="mu">Kilitler (sabitlemeler)</text><text x="630" y="218" font-size="15" class="mu">her zaman korunur</text><path class="flow" d="M826 175 H860" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M853 168 L862 175 L853 182" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="870" y="90" width="190" height="170" rx="14" fill="#121C30" stroke="#2A3B5C" stroke-width="1"/><circle cx="896" cy="120" r="13" fill="#2DD4BF"/><text x="896" y="125" text-anchor="middle" font-size="14" class="b" fill="#04201C">4</text><text x="920" y="126" font-size="17" class="b tx">Öneri ve Asistan</text><text x="890" y="166" font-size="15" class="mu">Uyarılar ve öneriler</text><text x="890" y="192" font-size="15" class="mu">Yalnız sizin onayınızla</text><text x="890" y="218" font-size="15" class="mu">plana uygulanır</text><path d="M965 266 V312 H425 V268" fill="none" stroke="#F5B544" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M418 277 L425 267 L432 277" fill="none" stroke="#F5B544" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="695.0" y="304" text-anchor="middle" font-size="14" fill="#F5B544">isteğe bağlı: gerçekleşen üretimle güncelle</text><rect x="40" y="352" width="1020" height="50" rx="12" fill="#182540" stroke="#2A3B5C"/><rect x="64" y="369" width="16" height="14" rx="3" fill="#2DD4BF"/><path d="M67 369 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#2DD4BF" stroke-width="2.5"/><text x="96" y="383" font-size="16" class="tx">Hesaplama bu bilgisayarda çalışır — plan verisi cihazda kalır</text>
</svg>
