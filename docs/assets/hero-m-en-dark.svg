<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="t d">
<title id="t">Beko Plan Optimizer</title>
<desc id="d">A desktop app that calculates, explains and safely updates your production plan.</desc>
<style>text{font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif}.b{font-weight:700}.sm{font-size:14px}.mu{fill:#A3B5D0}.tx{fill:#E8EEF8}.flow{stroke-dasharray:6 9;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-30}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(var(--sw,380px))}}.sweep{animation:sweep 7s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes drag{0%,12%{transform:translate(0,0)}45%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}.drag{animation:drag 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.flow,.sweep,.pulse,.drag{animation:none}}</style>
