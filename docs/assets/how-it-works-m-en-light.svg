<svg xmlns="http://www.w3.org/2000/svg" width="420" height="790" viewBox="0 0 420 790" role="img" aria-labelledby="t d">
<title id="t">How it works</title>
<desc id="d">Data → Two-stage optimisation → Plan → Suggestions and Assistant</desc>
<style>text{font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif}.b{font-weight:700}.sm{font-size:14px}.mu{fill:#43526B}.tx{fill:#0B1220}.flow{stroke-dasharray:6 9;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-30}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(var(--sw,380px))}}.sweep{animation:sweep 7s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes drag{0%,12%{transform:translate(0,0)}45%,70%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(0,0)}}.drag{animation:drag 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.flow,.sweep,.pulse,.drag{animation:none}}</style>
<rect width="420" height="790" rx="16" fill="#F4F7FB"/><rect x=".5" y=".5" width="419" height="789" rx="15.5" fill="none" stroke="#C3D0E3"/><text x="24" y="46" font-size="24" class="b tx">How it works</text><rect x="20" y="70" width="380" height="124" rx="14" fill="#FFFFFF" stroke="#C3D0E3" stroke-width="1"/><circle cx="48" cy="100" r="14" fill="#0A7A70"/><text x="48" y="106" text-anchor="middle" font-size="15" class="b" fill="#FFFFFF">1</text><text x="72" y="107" font-size="19" class="b tx">Data</text><text x="40" y="138" font-size="17" class="mu">Excel files</text><text x="40" y="162" font-size="17" class="mu">and manual entry</text><path d="M201 200 L210 210 L219 200" stroke="#0A7A70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="222" width="380" height="148" rx="14" fill="#FFFFFF" stroke="#0A7A70" stroke-width="2"/><circle cx="48" cy="252" r="14" fill="#0A7A70"/><text x="48" y="258" text-anchor="middle" font-size="15" class="b" fill="#FFFFFF">2</text><text x="72" y="259" font-size="19" class="b tx">Two-stage optimisation</text><text x="40" y="290" font-size="17" class="mu">1 · Assign: which card,</text><text x="40" y="314" font-size="17" class="mu">which line, which day</text><text x="40" y="338" font-size="17" class="mu">2 · Balance: stock &amp; buffer</text><path d="M201 376 L210 386 L219 376" stroke="#0A7A70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="398" width="380" height="148" rx="14" fill="#FFFFFF" stroke="#C3D0E3" stroke-width="1"/><circle cx="48" cy="428" r="14" fill="#0A7A70"/><text x="48" y="434" text-anchor="middle" font-size="15" class="b" fill="#FFFFFF">3</text><text x="72" y="435" font-size="19" class="b tx">Plan</text><text x="40" y="466" font-size="17" class="mu">Drag-and-drop editing</text><text x="40" y="490" font-size="17" class="mu">Locks (pins) are</text><text x="40" y="514" font-size="17" class="mu">always respected</text><path d="M201 552 L210 562 L219 552" stroke="#0A7A70" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="574" width="380" height="148" rx="14" fill="#FFFFFF" stroke="#C3D0E3" stroke-width="1"/><circle cx="48" cy="604" r="14" fill="#0A7A70"/><text x="48" y="610" text-anchor="middle" font-size="15" class="b" fill="#FFFFFF">4</text><text x="72" y="611" font-size="19" class="b tx">Suggestions and Assistant</text><text x="40" y="642" font-size="17" class="mu">Warnings and suggestions</text><text x="40" y="666" font-size="17" class="mu">Applied to the plan only</text><text x="40" y="690" font-size="17" class="mu">with your approval</text><text x="24" y="760" font-size="16" fill="#8A5200">↺ optional: update with actual production</text><rect x="20" y="784" width="380" height="74" rx="12" fill="#E8EFF8" stroke="#C3D0E3"/><text x="40" y="814" font-size="17" class="tx">Calculation runs on this computer</text><text x="40" y="840" font-size="17" class="tx">— plan data stays on the device</text>
</svg>
